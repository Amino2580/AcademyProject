services:

  db:
    image: postgres:17
    container_name: academy-postgres

    environment:
      POSTGRES_DB: academy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 'Amin@2026Strong'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: academy-django

    command: python manage.py runserver 0.0.0.0:8000

    environment:
      POSTGRES_DB: academy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 'Amin@2026Strong'
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: